name: Build and Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libcunit1-dev python3
      - name: Build simulator and C tests
        run: make -j2 all test-binaries
      - name: Run heartbeat, matrix clock, intruder, leader integration, and bridge tests
        run: python3 scripts/run_tests.py heartbeat_test test_matrix_clock test_intruder test_leader_integration python
      - name: Report original cruise assertions (known failures; see docs/TESTING.md)
        id: legacy-cruise
        continue-on-error: true
        run: make test-cruise-control
      - name: Explain legacy test outcome
        if: steps.legacy-cruise.outcome == 'failure'
        run: echo 'Original cruise-control assertions fail against current constants and stimuli. This step is allowed to fail; see docs/TESTING.md. A passing workflow does not mean every legacy assertion passed.' >> "$GITHUB_STEP_SUMMARY"
